name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[test]" || pip install -e . && pip install pytest pytest-cov

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Coverage check
        run: python -m pytest tests/ --cov=pyfusa --cov-report=term-missing --cov-fail-under=80
        continue-on-error: true

  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: pyfusa version
        run: pyfusa version

      - name: pyfusa capabilities
        run: pyfusa capabilities --format json

      - name: pyfusa check (self)
        run: pyfusa check --dir . || true

      - name: pyfusa qualify
        run: pyfusa qualify --format json --output qualify-report.json

      - name: pyfusa trace
        run: pyfusa trace --format json

      - name: pyfusa release
        run: pyfusa release --dir .

      - name: pyfusa audit-pack
        run: pyfusa audit-pack --dir .
