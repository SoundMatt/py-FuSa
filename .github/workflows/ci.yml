name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit tests (multi-OS, multi-Python) ──────────────────────────────────
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e . pytest pytest-cov

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Coverage gate (≥ 80 %)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m pytest tests/ --cov=pyfusa --cov-report=term-missing --cov-fail-under=80
        continue-on-error: true

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage

  # ── Docker build verification ─────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag py-fusa:ci .

      - name: Smoke-test binary in image
        run: docker run --rm py-fusa:ci version

      - name: Capabilities in image
        run: docker run --rm py-fusa:ci capabilities --format json

  # ── Self-qualification (pyfusa runs against its own source) ──────────────
  selfcheck:
    name: Self-qualification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: version
        run: pyfusa version

      - name: capabilities
        run: pyfusa capabilities --format json

      - name: check (static analysis)
        run: pyfusa check --dir . --format json --output check-report.json || true

      - name: lint
        run: pyfusa lint --dir . || true

      - name: analyze (ANA rules)
        run: pyfusa analyze --dir . || true

      - name: cyber (CYBER rules)
        run: pyfusa cyber --dir . || true

      - name: fmea
        run: pyfusa fmea --dir . --format json --output fmea.json

      - name: boundary
        run: pyfusa boundary --dir . --format json --output boundary.json

      - name: coupling
        run: pyfusa coupling --dir . --format json --output coupling-report.json

      - name: tara (from check-report)
        run: pyfusa tara --dir . --from check-report.json --format json --output tara.json || true

      - name: hara init
        run: pyfusa hara init --dir . || true

      - name: hara validate
        run: pyfusa hara validate --dir . || true

      - name: trace
        run: pyfusa trace --dir . --format json

      - name: qualify
        run: pyfusa qualify --dir . --format json --output qualify-report.json

      - name: release (SBOM + provenance)
        run: pyfusa release --dir .

      - name: audit-pack
        run: pyfusa audit-pack --dir .

      - name: verify (test evidence bundle)
        run: pyfusa verify --dir . || true

      - name: disposition list
        run: pyfusa disposition list --dir .

      - name: diff (baseline vs current)
        run: pyfusa diff check-report.json check-report.json

      - name: badge
        run: pyfusa badge --from check-report.json --output badge.svg

      - name: sign keygen
        run: pyfusa sign keygen --output .fusa-key.bin

      - name: sign file
        run: pyfusa sign sign --key .fusa-key.bin check-report.json --output check-report.json.sig

      - name: sign verify
        run: pyfusa sign verify --key .fusa-key.bin check-report.json --sig check-report.json.sig

      - name: vuln scan
        run: pyfusa vuln --dir . || true

      - name: pr list
        run: pyfusa pr list --dir .

      - name: impact
        run: pyfusa impact --dir . || true

      - name: metrics collect
        run: pyfusa metrics collect --dir .

      - name: safety-case
        run: pyfusa safety-case --dir . --format json --output safety-case.json || true

      - name: iso26262 gap report
        run: pyfusa iso26262 --dir . --format json --output iso26262-gap-report.json || true

      - name: iec61508 gap report
        run: pyfusa iec61508 --dir . --format json --output iec61508-gap-report.json || true

      - name: do178 gap report
        run: pyfusa do178 --dir . --format json --output do178-gap-report.json || true

      - name: iso21434 gap report
        run: pyfusa iso21434 --dir . --format json --output iso21434-gap-report.json || true

      - name: unece gap report
        run: pyfusa unece --dir . --format json --output unece-gap-report.json || true

      - name: sas (Software Accomplishment Summary)
        run: pyfusa sas --dir . --format json --output sas.json

      - name: sci (Software Configuration Index)
        run: pyfusa sci --dir . --format json --output sci.json

      - name: coverage report
        run: pyfusa coverage --dir . || true

      - name: template list
        run: pyfusa template --list

      - name: misra mapping
        run: pyfusa misra

      - name: req list
        run: pyfusa req list --dir .

      - name: Upload safety evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: safety-evidence
          path: |
            check-report.json
            qualify-report.json
            fmea.json
            boundary.json
            coupling-report.json
            tara.json
            safety-case.json
            sbom.json
            provenance.json
            sas.json
            sci.json

  # ── SARIF upload (GitHub Code Scanning) ──────────────────────────────────
  sarif:
    name: SARIF upload
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Run pyfusa check --format sarif
        run: pyfusa check --dir . --format sarif --output results.sarif || true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  # ── Doc / version consistency check ──────────────────────────────────────
  docs:
    name: Doc version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version consistency
        shell: bash
        run: |
          VER=$(grep '^version' pyproject.toml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Checking docs reference version: $VER"
          FAIL=0
          if ! grep -q "$VER" README.md; then
            echo "FAIL: README.md does not reference version $VER"
            FAIL=1
          fi
          [ $FAIL -eq 0 ] && echo "PASS: all docs reference $VER"
          exit $FAIL
