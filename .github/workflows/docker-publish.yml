name: Docker Publish

on:
  push:
    tags:
      - "v*"

jobs:
  push:
    name: Build and push ghcr.io/soundmatt/py-fusa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract pyfusa version and spec-version
        id: pyfusa
        shell: bash
        run: |
          VERSION=$(grep -oE '^VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' pyfusa/__init__.py | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          SPEC_VERSION=$(grep -oE '^SPEC_VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' pyfusa/__init__.py | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "spec_version=$SPEC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/soundmatt/py-fusa
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYFUSA_VERSION=${{ steps.pyfusa.outputs.version }}
            SPEC_VERSION=${{ steps.pyfusa.outputs.spec_version }}

      - name: Notify FuSaOps
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.FUSAOPS_DISPATCH_TOKEN }}
          repository: SoundMatt/FuSaOps
          event-type: xfusa-released
          client-payload: '{"tool":"py-FuSa","version":"${{ github.ref_name }}"}'
        continue-on-error: true
